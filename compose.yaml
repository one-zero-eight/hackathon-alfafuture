services:
  news:
    build:
      context: ./backend
      dockerfile: Dockerfile.news
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the root .env}
      HTTP_ADDR: 0.0.0.0:8080
      POLL_INTERVAL: ${POLL_INTERVAL:-10m}
      FETCH_TIMEOUT: ${FETCH_TIMEOUT:-30s}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-2m}
      FETCH_MAX_MB: ${FETCH_MAX_MB:-8}
      RBC_FEED_URL: ${RBC_FEED_URL:-https://rssexport.rbc.ru/rbcnews/news/30/full.rss}
      KOMMERSANT_FEED_URL: ${KOMMERSANT_FEED_URL:-https://www.kommersant.ru/RSS/news.xml}
      CBR_FEED_URL: ${CBR_FEED_URL:-https://www.cbr.ru/rss/eventrss}
      LLM_API_KEY: ${LLM_API_KEY:?Set LLM_API_KEY in the root .env}
      LLM_MODEL: ${LLM_MODEL:-deepseek/deepseek-v4.1-flash}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    cpus: 1
    mem_limit: 1g
    stop_grace_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:18.6-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
    environment:
      POSTGRES_DB: news
      POSTGRES_USER: news
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "news", "-d", "news"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    cpus: 1
    mem_limit: 512m
    stop_grace_period: 20s
    restart: unless-stopped

volumes:
  postgres_data:
