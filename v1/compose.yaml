services:
  collector:  # Alexandr's Go service: RBC, Kommersant, CBR (tagging removed)
    build:
      context: ./backend
      dockerfile: Dockerfile.news
    environment:
      DATABASE_URL: postgres://news:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/news?sslmode=disable
      HTTP_ADDR: 0.0.0.0:8080
      POLL_INTERVAL: ${POLL_INTERVAL:-10m}
      FETCH_TIMEOUT: ${FETCH_TIMEOUT:-30s}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-2m}
      FETCH_MAX_MB: ${FETCH_MAX_MB:-8}
      RBC_FEED_URL: ${RBC_FEED_URL:-https://rssexport.rbc.ru/rbcnews/news/30/full.rss}
      KOMMERSANT_FEED_URL: ${KOMMERSANT_FEED_URL:-https://www.kommersant.ru/RSS/news.xml}
      CBR_FEED_URL: ${CBR_FEED_URL:-https://www.cbr.ru/rss/eventrss}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    cpus: 1
    mem_limit: 1g
    stop_grace_period: 20s
    restart: unless-stopped

  scraper:  # ingest.py loop: 129 RSS feeds + rolling Google News passes
    build:
      context: .
      dockerfile: scraper/Dockerfile
    environment:
      DATABASE_URL: postgres://news:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/news?sslmode=disable
    depends_on:
      collector:
        condition: service_healthy
    restart: unless-stopped

  pipeline:  # worker: profile -> pipeline.py (embeddings + LLM picks, cached for 24 h) -> analyze.py -> v1_profiles.page
    build:
      context: .
      dockerfile: worker/Dockerfile
    env_file: ../.env  # LLM_API_KEY, LLM_BASE_URL (repo-root .env, gitignored)
    environment:
      DATABASE_URL: postgres://news:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/news?sslmode=disable
    volumes:
      - hf_cache:/hf_cache
      - pipeline_out:/app/out
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  api:  # UI API: mock contract + live news from the corpus
    build:
      context: ..
      dockerfile: v1/server/Dockerfile
    environment:
      DATABASE_URL: postgres://news:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/news?sslmode=disable
    depends_on:
      collector:
        condition: service_healthy
    restart: unless-stopped

  web:  # built UI behind nginx, /api goes to `api`
    build:
      context: ..
      dockerfile: v1/web/Dockerfile
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - api
    restart: unless-stopped

  postgres:
    image: postgres:18.6-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
    environment:
      POSTGRES_DB: news
      POSTGRES_USER: news
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
    ports:
      - "127.0.0.1:5433:5432"  # v1/pipeline.py reads the corpus from the host
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "news", "-d", "news"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    cpus: 1
    mem_limit: 512m
    stop_grace_period: 20s
    restart: unless-stopped

volumes:
  postgres_data:
  hf_cache:
  pipeline_out:
