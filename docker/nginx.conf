server {
    listen 80;
    root /usr/share/nginx/html;
    resolver 127.0.0.11 valid=10s;  # Docker DNS: the backend container may be recreated with a new address
    location /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_read_timeout 120s;
    }
    location / { try_files $uri /index.html; }
}
